<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Clone</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <main class="container">
        <div class="title">
            <h1>Flappy Bird</h1>
        </div>
        <div class="game-screen">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
        </div>
        <p id="game-description" class="game-description">Pressez 'ESPACE' ou 'CLIQUEZ' pour commencer</p>

        <div class="game-over-screen hidden">
            <h2 class="game-over-title">Game Over !</h2>
            <p class="display-score">Score: <span id="finalScore">0</span></p>
            <p class="display-score">Meilleur score: <span id="bestScore">0</span></p>
            <button id="restartButton" class="restart-button">Recommencer</button>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
