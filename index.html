<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Clone</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <!-- Conteneur pour le jeu -->
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="ui-overlay">
            <!-- Ecran de démarrage -->
            <div id="startScreen" class="screen">
                <h1>Flappy Clone</h1>
                <p>Pressez la touche ESPACE ou cliquez pour commencer</p>
                <div class="instructions">
                    <p>Appuyez sur ESPACE ou cliquez pour faire voler l'oiseau</p>
                    <p>Évitez les tuyaux !</p>
                </div>
            </div>

            <!-- Ecran de fin de partie -->
            <div id="gameOverScreen" class="screen hidden">
                <h2>Game Over !</h2>
                <p id="finalScore">Score: 0</p>
                <p id="bestScore">Meilleur score: 0</p>
                <button id="restartBtn">Rejouer</button>
            </div>

            <!-- Affichage du score en cours -->
            <div id="gameUI" class="hidden">
                <div id="score">0</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
